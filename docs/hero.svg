<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#052e2b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#059669"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.75" cy="0.35" r="0.9">
      <stop offset="0" stop-color="#059669" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#059669" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="480" fill="url(#bg)"/>
  <rect width="1200" height="480" fill="url(#glow)"/>

  <!-- left: copy -->
  <text x="64" y="150" fill="#34d399" font-size="20" font-weight="700" letter-spacing="3">DEBTFREE</text>
  <text x="64" y="215" fill="#f9fafb" font-size="46" font-weight="800">A plan to be debt-free,</text>
  <text x="64" y="266" fill="#f9fafb" font-size="46" font-weight="800">month by month</text>
  <text x="64" y="315" fill="#9ca3af" font-size="19">Snowball vs avalanche · payoff order · interest savings</text>
  <text x="64" y="345" fill="#9ca3af" font-size="19">Free &amp; private — your numbers never leave the device.</text>

  <!-- right: chart card -->
  <g transform="translate(720,90)">
    <rect width="400" height="300" rx="16" fill="#ffffff"/>
    <rect width="400" height="10" rx="5" fill="url(#accent)"/>
    <text x="24" y="46" fill="#6b7280" font-size="12" font-weight="700" letter-spacing="1">TOTAL BALANCE</text>
    <text x="24" y="78" fill="#047857" font-size="30" font-weight="800">$4,180 → $0</text>
    <text x="330" y="46" fill="#059669" font-size="13" font-weight="800" text-anchor="end">14 months</text>

    <!-- descending balance area chart -->
    <g transform="translate(24,100)">
      <line x1="0" y1="60" x2="352" y2="60" stroke="#e5e7eb" stroke-width="1"/>
      <line x1="0" y1="120" x2="352" y2="120" stroke="#e5e7eb" stroke-width="1"/>
      <path d="M0,10 L44,38 L88,64 L132,88 L176,110 L220,128 L264,144 L308,158 L352,170 L352,175 L0,175 Z" fill="#059669" opacity="0.12"/>
      <path d="M0,10 L44,38 L88,64 L132,88 L176,110 L220,128 L264,144 L308,158 L352,170" fill="none" stroke="#059669" stroke-width="4" stroke-linejoin="round"/>
      <circle cx="352" cy="170" r="6" fill="#059669"/>
      <circle cx="352" cy="170" r="11" fill="#059669" opacity="0.25"/>
    </g>

    <!-- payoff order chips -->
    <g transform="translate(24,236)">
      <rect width="86" height="28" rx="14" fill="#ecfdf5"/>
      <text x="43" y="19" text-anchor="middle" fill="#047857" font-size="12" font-weight="700">1 ★ Store</text>
      <rect x="94" width="96" height="28" rx="14" fill="#ecfdf5"/>
      <text x="142" y="19" text-anchor="middle" fill="#047857" font-size="12" font-weight="700">2 Medical</text>
      <rect x="198" width="92" height="28" rx="14" fill="#f1f5f9"/>
      <text x="244" y="19" text-anchor="middle" fill="#64748b" font-size="12" font-weight="700">3 Card</text>
      <rect x="298" width="78" height="28" rx="14" fill="#f1f5f9"/>
      <text x="337" y="19" text-anchor="middle" fill="#64748b" font-size="12" font-weight="700">4 Loan</text>
    </g>
  </g>

  <text x="600" y="452" text-anchor="middle" fill="#6b7280" font-size="15">chr-z.github.io/debtfree · MIT · built by @chr-z</text>
</svg>
