name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Tests before publishing
        run: npm test
      - name: Build (Svelte 5 + Vite)
        run: npx vite build
      - name: Stamp service-worker cache version with commit SHA
        run: sed -i "s|self.__DEBTFREE_CACHE_VERSION__|'${GITHUB_SHA::7}'|" dist/sw.js
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
