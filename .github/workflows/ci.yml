name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck (TypeScript strict)
        run: npx tsc --noEmit
      - name: Run unit tests (vitest)
        run: npm test
      - name: Guard - no secrets committed
        run: |
          if grep -rniE '(api[_-]?key|secret|password)[[:space:]]*[:=]' src/ public/locales/ 2>/dev/null; then exit 1; fi
          echo "ok: no secrets found"
